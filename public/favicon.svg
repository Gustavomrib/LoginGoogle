<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background - Dark theme project colors -->
  <rect width="256" height="256" rx="60" fill="#0f172a"/>
  
  <!-- Gradient circle - Project colors -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="128" cy="128" r="100" fill="url(#gradient)"/>
  
  <!-- Lock icon (security/auth symbol) -->
  <g transform="translate(128, 128)">
    <!-- Lock body -->
    <rect x="-30" y="-15" width="60" height="50" rx="8" fill="#cbd5e1" opacity="0.9"/>
    
    <!-- Lock shackle -->
    <path d="M -20 -15 Q -20 -40 0 -40 Q 20 -40 20 -15" 
          fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Lock hole -->
    <circle cx="0" cy="15" r="5" fill="#0f172a"/>
  </g>
</svg>